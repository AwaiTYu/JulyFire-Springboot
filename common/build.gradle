plugins {
    id 'org.springframework.boot' version '3.3.1'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'org.jetbrains.kotlin.jvm' version '1.9.24'
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.24'
}

group = 'awaitzhang'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'


    api("org.springframework.boot:spring-boot-starter-validation")
    api("org.springframework.boot:spring-boot-starter-security")
    api("org.springframework.boot:spring-boot-starter-aop")
    api("jakarta.servlet:jakarta.servlet-api:6.0.0")
   

    api 'org.springframework.boot:spring-boot-starter'
    api 'org.jetbrains.kotlin:kotlin-reflect'
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'com.alibaba:druid-spring-boot-3-starter:1.2.22' // starter for springboot 3.x
    api 'com.alibaba:druid-spring-boot-starter:1.2.22'
    api 'com.mysql:mysql-connector-j'
    //mybatis-plus
    api 'com.baomidou:mybatis-plus:3.5.7'
    api 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.7'
    api 'org.springframework.boot:spring-boot-starter-actuator'

    //邮件服务
    api 'org.springframework.boot:spring-boot-starter-mail'
    //redis
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    //kotlin


     // 添加协程 Reactor 支持（用于响应式编程）
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-reactor:1.8.1'


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}